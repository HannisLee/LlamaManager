<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LlamaManager</title>
    <link rel="icon" href="/icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            padding: 20px 0;
            font-size: 1.8em;
            color: #fff;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
        }

        .card {
            background: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 错误横幅 */
        #error-bar {
            display: none;
            background: #c62828;
            color: white;
            padding: 10px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        #error-bar button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2em;
            margin-left: 10px;
            cursor: pointer;
        }

        /* 状态徽章 */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .badge-running { background: #2e7d32; color: #fff; }
        .badge-stopped { background: #555; color: #ccc; }
        .badge-danger { background: #c62828; color: #fff; }
        .badge-warning { background: #e65100; color: #fff; }

        /* 状态信息行 */
        .status-info {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 12px;
            margin: 10px 0;
            font-size: 0.95em;
        }
        .status-info dt { color: #888; }
        .status-info dd {
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            color: #e0e0e0;
            word-break: break-all;
        }

        /* 按钮组 */
        .btn-group { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

        /* 按钮 */
        button, .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background: #1565c0; color: #fff; }
        .btn-danger { background: #c62828; color: #fff; }
        .btn-success { background: #2e7d32; color: #fff; }
        .btn-secondary { background: #444; color: #ccc; }
        .btn-warning { background: #e65100; color: #fff; }

        /* 表单 */
        .form-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 8px 12px;
            align-items: center;
        }
        .form-grid label {
            color: #aaa;
            font-size: 0.9em;
            text-align: right;
        }
        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 6px 10px;
            background: #0f1629;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.9em;
        }
        .form-grid input:focus,
        .form-grid select:focus,
        .form-grid textarea:focus {
            outline: none;
            border-color: #1565c0;
        }
        .form-grid select option {
            background: #0f1629;
            color: #e0e0e0;
        }

        .full-width { grid-column: 1 / -1; }
        .hidden { display: none; }

        .custom-service-list {
            margin-top: 12px;
            border-top: 1px solid #2f3b52;
            padding-top: 12px;
        }
        .custom-service-list h3 {
            font-size: 0.95em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .custom-service-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: start;
            padding: 12px 0;
            border-bottom: 1px solid #263247;
            font-size: 0.88em;
        }
        .custom-service-row:last-child {
            border-bottom: none;
        }
        .custom-service-details {
            display: grid;
            gap: 6px;
            min-width: 0;
        }
        .custom-service-name {
            min-width: 0;
        }
        .custom-service-field {
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr);
            gap: 8px;
            align-items: baseline;
            min-width: 0;
        }
        .custom-service-label {
            color: #7d8ba3;
            text-align: right;
            white-space: nowrap;
        }
        .custom-service-value {
            color: #aaa;
            min-width: 0;
        }
        .custom-service-command {
            color: #b7c7df;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .custom-service-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .custom-service-empty {
            color: #7d8ba3;
            font-size: 0.88em;
        }
        .download-task-list {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }
        .download-task-row {
            display: grid;
            grid-template-columns: minmax(180px, 1.2fr) minmax(160px, 1fr) 120px auto;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #263247;
            font-size: 0.88em;
        }
        .download-task-row:last-child {
            border-bottom: none;
        }
        .download-task-title {
            min-width: 0;
        }
        .download-task-title strong,
        .download-task-title span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .download-task-title span {
            color: #7d8ba3;
            font-size: 0.9em;
        }
        .download-progress {
            min-width: 0;
        }
        .download-progress-track {
            background: #0a0a1a;
            border: 1px solid #333;
            border-radius: 4px;
            height: 16px;
            overflow: hidden;
        }
        .download-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1565c0, #2e7d32);
            width: 0%;
            transition: width 0.3s;
        }
        .download-progress-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: #888;
            font-size: 0.82em;
            margin-top: 4px;
        }
        .download-task-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .start-feedback {
            display: none;
            margin-top: 10px;
            padding: 8px 10px;
            border: 1px solid #2f3b52;
            border-radius: 4px;
            background: #101b32;
            color: #b7c7df;
            font-size: 0.9em;
        }
        .start-feedback strong {
            color: #e5eefc;
        }
        .settings-detect-status {
            display: none;
            color: #b7c7df;
            font-size: 0.88em;
            margin-top: 8px;
            word-break: break-all;
        }
        .settings-detect-status.error {
            color: #ffb3b3;
        }

        /* 日志区域 */
        .log-area {
            width: 100%;
            min-height: 180px;
            max-height: 600px;
            height: 320px;
            background: #0a0a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #b0b0b0;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.85em;
            padding: 10px;
            resize: vertical;
            overflow-y: auto;
        }

        /* Qwen3 ASR 专用转写页 */
        .asr-page {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px;
        }
        .asr-page h1 {
            text-align: left;
            padding: 0 0 16px;
            margin-bottom: 20px;
        }
        .asr-page .card h2 {
            text-transform: none;
            letter-spacing: 0;
            color: #e0e0e0;
        }
        .asr-file-name {
            color: #b7c7df;
            font-size: 0.9em;
            word-break: break-all;
        }
        .asr-result-area {
            min-height: 360px;
            height: 52vh;
            color: #edf4ff;
            font-size: 0.98em;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .asr-hint {
            color: #8fa1bd;
            font-size: 0.88em;
            margin-top: 6px;
        }
        .asr-drop-zone {
            display: block;
            border: 2px dashed #48698f;
            border-radius: 8px;
            padding: 26px 18px;
            text-align: center;
            cursor: pointer;
            color: #b7c7df;
            background: #101b32;
            transition: border-color 0.2s, background 0.2s;
        }
        .asr-drop-zone:hover,
        .asr-drop-zone.drag-over {
            border-color: #4e9cff;
            background: #162b4b;
        }
        .asr-history-list {
            display: grid;
            gap: 8px;
        }
        .asr-history-item {
            border: 1px solid #2f3b52;
            border-radius: 6px;
            overflow: hidden;
            background: #101b32;
        }
        .asr-history-header {
            display: flex;
            align-items: stretch;
        }
        .asr-history-toggle {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: #e7eef8;
            background: transparent;
            text-align: left;
        }
        .asr-history-toggle strong {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-height: 1.35;
        }
        .asr-history-toggle .badge {
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .asr-history-delete {
            flex: 0 0 auto;
            align-self: center;
            margin: 0 10px 0 0;
        }
        .asr-history-meta {
            flex: 0 0 auto;
            color: #8fa1bd;
            font-size: 0.82em;
            white-space: nowrap;
        }
        .asr-history-content {
            padding: 0 12px 12px;
            border-top: 1px solid #2f3b52;
        }
        .asr-history-edit {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: stretch;
            margin-top: 10px;
        }
        .asr-history-name-input {
            width: 100%;
            min-height: 58px;
            padding: 8px 10px;
            resize: vertical;
            background: #0f1629;
            border: 1px solid #48698f;
            border-radius: 4px;
            color: #edf4ff;
            font-size: 1em;
            line-height: 1.5;
        }
        .asr-history-edit-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .asr-history-text {
            min-height: 180px;
            height: 260px;
            margin-top: 10px;
        }

        /* checkbox */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1565c0;
        }
        .checkbox-row label {
            color: #aaa;
            font-size: 0.9em;
        }

        /* GPU 监控 */
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .card-header-row h2 {
            margin-bottom: 0;
        }
        .compact-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 0.9em;
        }
        .compact-control select {
            padding: 5px 8px;
            background: #0f1629;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
        }
        .gpu-error {
            display: none;
            margin-bottom: 10px;
            padding: 8px 10px;
            border: 1px solid #6d3d16;
            border-radius: 4px;
            background: #2d2118;
            color: #ffb066;
            font-size: 0.9em;
        }
        .gpu-wave-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .gpu-wave-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gpu-wave-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .gpu-wave-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .gpu-wave-card {
            background: #0f1629;
            border: 1px solid #2f3b52;
            border-radius: 6px;
            padding: 10px;
            min-width: 0;
        }
        .gpu-wave-title {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: #dbe6f3;
            font-size: 0.9em;
            margin-bottom: 6px;
        }
        .gpu-wave-title span {
            color: #8fa1bd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .gpu-wave-canvas {
            width: 100%;
            height: 150px;
            display: block;
            background: #10161d;
            border: 1px solid #263247;
            border-radius: 4px;
        }
        .gpu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .gpu-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gpu-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .gpu-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .gpu-card {
            background: #0f1629;
            border: 1px solid #2f3b52;
            border-radius: 6px;
            padding: 12px;
            min-width: 0;
        }
        .gpu-card-title {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .gpu-card-title strong {
            color: #fff;
            font-size: 1em;
        }
        .gpu-card-title span {
            color: #8fa1bd;
            font-size: 0.82em;
            word-break: break-word;
            text-align: right;
        }
        .gpu-metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }
        .gpu-metric {
            background: #0a0f1f;
            border: 1px solid #263247;
            border-radius: 4px;
            padding: 7px 8px;
            min-width: 0;
        }
        .gpu-metric label {
            display: block;
            color: #7e8da6;
            font-size: 0.75em;
            line-height: 1.2;
        }
        .gpu-metric span {
            display: block;
            color: #e8edf5;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.95em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gpu-util-bar {
            height: 12px;
            background: #07100c;
            border: 1px solid #1d3f2b;
            border-radius: 3px;
            overflow: hidden;
        }
        .gpu-util-fill {
            height: 100%;
            background: linear-gradient(90deg, #1b8f4a, #6be675);
            width: 0%;
            transition: width 0.25s;
        }
        .gpu-empty {
            color: #888;
            padding: 14px 0;
            text-align: center;
        }
        .table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #2f3b52;
            border-radius: 6px;
            background: #0f1629;
        }
        .gpu-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
            font-size: 0.88em;
        }
        .gpu-table th,
        .gpu-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #263247;
            text-align: left;
            white-space: nowrap;
        }
        .gpu-table th {
            background: #101b32;
            color: #8fa1bd;
            font-weight: 600;
        }
        .gpu-table td {
            color: #dde5ef;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
        }
        .gpu-table tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 760px) {
            .container { padding: 12px; }
            .custom-service-row {
                grid-template-columns: 1fr;
                align-items: start;
            }
            .custom-service-field {
                grid-template-columns: 64px minmax(0, 1fr);
            }
            .download-task-row {
                grid-template-columns: 1fr;
                align-items: start;
            }
            .custom-service-actions {
                justify-content: flex-start;
            }
            .download-task-actions {
                justify-content: flex-start;
            }
            .asr-history-edit {
                grid-template-columns: 1fr;
            }
            .gpu-wave-grid,
            .gpu-wave-grid.cols-2,
            .gpu-wave-grid.cols-3,
            .gpu-wave-grid.cols-4,
            .gpu-grid,
            .gpu-grid.cols-2,
            .gpu-grid.cols-3,
            .gpu-grid.cols-4 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- 错误横幅 -->
<div id="error-bar">
    <span id="error-text"></span>
    <button onclick="clearError()">&times;</button>
</div>

<div class="container">
    <h1><img src="/icon.png" alt="LlamaManager" style="height:32px;vertical-align:middle;"> LlamaManager</h1>

    <!-- GPU 监控 -->
    <div class="card">
        <div class="card-header-row">
            <h2>GPU 监控</h2>
            <label class="compact-control" for="gpu-cards-per-row">
                Cards per row
                <select id="gpu-cards-per-row" onchange="setGpuCardsPerRow()">
                    <option value="auto">Auto</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </label>
        </div>
        <div id="gpu-error" class="gpu-error"></div>
        <div id="gpu-wave-grid" class="gpu-wave-grid">
            <div class="gpu-empty">正在加载 GPU 波形...</div>
        </div>
        <div id="gpu-grid" class="gpu-grid">
            <div class="gpu-empty">正在加载 GPU 状态...</div>
        </div>
        <div class="table-wrap">
            <table class="gpu-table">
                <thead>
                    <tr>
                        <th>GPU</th>
                        <th>GPU Name</th>
                        <th>GPU Util</th>
                        <th>PID</th>
                        <th>Used Mem</th>
                        <th>Total Mem</th>
                        <th>Temp</th>
                        <th>Model Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="gpu-process-body">
                    <tr><td colspan="9" class="gpu-empty">暂无受管进程</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 第二块：服务管理（注册 + 启动） -->
    <div class="card">
        <h2>服务管理</h2>

        <!-- 已注册服务 -->
        <div class="custom-service-list">
            <h3>已注册服务</h3>
            <div id="registered-service-list" class="custom-service-empty">暂无已注册服务</div>
        </div>

        <!-- 注册表单：通用启动命令 -->
        <div class="form-grid">
            <input type="hidden" id="custom-service-id">

            <label for="custom-service-name">服务名</label>
            <input type="text" id="custom-service-name" placeholder="留空则从启动命令推断">

            <label for="custom-service-category">服务类型</label>
            <select id="custom-service-category">
                <option value="llm">标准 LLM</option>
                <option value="asr">ASR</option>
            </select>

            <label>GPU</label>
            <div id="start-gpu-list" style="display:flex; gap:10px; flex-wrap:wrap; color:#aaa; font-size:0.9em;">
                <span style="color:#888;">自动使用全部可见 GPU</span>
            </div>

            <label for="custom-service-command">启动命令</label>
            <textarea id="custom-service-command" rows="4" placeholder="例如：python -m vllm.entrypoints.openai.api_server --model /path/to/model --port 8085"></textarea>
            <div class="full-width asr-hint">启动时会自动以 <code>nohup</code> 后台运行，输出写入独立日志；勾选 GPU 后仅向命令暴露所选 GPU。</div>

            <div class="full-width btn-group">
                <button class="btn-primary" id="custom-service-save-btn" onclick="saveService()">保存服务</button>
                <button class="btn-secondary" onclick="resetServiceForm()">清空</button>
            </div>
        </div>
        <div id="start-feedback" class="start-feedback"></div>
    </div>

    <!-- 第四块：服务日志 -->
    <div class="card">
        <h2>服务日志</h2>
        <div class="btn-group" style="margin-bottom:10px; align-items:center;">
            <select id="log-process-select" onchange="loadLogs()" style="padding:6px 10px; background:#0f1629; border:1px solid #333; border-radius:4px; color:#e0e0e0; min-width:260px;">
                <option value="">当前运行任务</option>
            </select>
            <button class="btn-secondary" onclick="loadLogs()">Refresh Logs</button>
        </div>
        <textarea id="log-area" class="log-area" readonly placeholder="暂无日志"></textarea>
    </div>

    <!-- 第五块：下载模型 -->
    <div class="card">
        <h2>下载模型</h2>
        <div class="form-grid">
            <label for="dl-repo">仓库</label>
            <input type="text" id="dl-repo" placeholder="tencent/Hy-MT2-7B-GGUF">

            <input type="text" id="dl-filename" placeholder="留空则全量下载整个仓库">

                <option value="">最新下载任务</option>
            </select>
            <button class="btn-secondary" onclick="loadDownloadLogs()">Refresh Logs</button>

    <!-- 第七块：设置 -->
    <div class="card">
        <h2>设置</h2>
        <div class="form-grid">
            <label for="set-model-dir">模型下载目录</label>
            <input type="text" id="set-model-dir" placeholder="/path/to/gguf">
            <label for="set-gpu-history-hours">GPU 历史小时数</label>
            <input type="number" id="set-gpu-history-hours" min="0.25" max="168" step="0.25" value="2">
            <div class="full-width" style="border-top:1px solid #2f3b52; margin-top:6px; padding-top:14px; color:#aaa;">OpenAI 兼容 API</div>
            <label for="set-openai-api-base-url">API 地址</label>
            <input type="url" id="set-openai-api-base-url" placeholder="https://api.openai.com/v1">
            <label for="set-openai-api-model">模型名称</label>
            <input type="text" id="set-openai-api-model" list="openai-api-model-options" placeholder="先测试连接以获取模型列表，也可手动输入">
            <datalist id="openai-api-model-options"></datalist>
            <label for="set-openai-api-key">API 密钥</label>
            <input type="password" id="set-openai-api-key" autocomplete="new-password" placeholder="留空则不修改已保存的密钥">
            <div class="full-width checkbox-row">
                <input type="checkbox" id="set-clear-openai-api-key">
                <label for="set-clear-openai-api-key">清除已保存的 API 密钥</label>
            </div>
        </div>
        <div class="btn-group" style="margin-top:12px">
            <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
            <button class="btn-secondary" id="openai-api-test-btn" onclick="testOpenAiApi()">测试连接</button>
            <span id="openai-api-status" style="color:#888; font-size:0.85em;"></span>
        </div>
    </div>
</div>

<script>
// ── 全局状态 ──────────────────────────────────────────
let currentSettings = {};
let currentGpuIndexes = [];
let customServices = [];
let modelRepositories = [];
let managedProcessRecords = [];
let downloadTasks = [];
let completedDownloadTaskIds = new Set();
let editingCustomServiceId = "";

// ── 工具函数 ──────────────────────────────────────────

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function clampPercent(value) {
    const n = Number(value) || 0;
    return Math.max(0, Math.min(100, n));
}

function formatMem(value) {
    if (value === null || value === undefined || value === "") return "-";
    const n = Number(value) || 0;
    if (n >= 1024) return `${(n / 1024).toFixed(1)} GB`;
    return `${n} MB`;
}

function formatClock(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
}

function showError(msg) {
    const bar = document.getElementById("error-bar");
    document.getElementById("error-text").textContent = msg;
    bar.style.display = "block";
    setTimeout(clearError, 5000);
}

function clearError() {
    document.getElementById("error-bar").style.display = "none";
}

async function api(method, path, body) {
    const opts = { method, headers: { "Content-Type": "application/json" } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const resp = await fetch(path, opts);
    const data = await resp.json();
    if (!resp.ok) {
        const msg = data.detail || data.error || JSON.stringify(data);
        showError(msg);
        throw new Error(msg);
    }
    return data;
}

function isAsrProcess(proc) {
    const service = customServices.find(item => item.id === proc?.service_id);
    const category = proc?.service_category || service?.service_category;
    if (category === "asr" || category === "llm") return category === "asr";
    const identity = [proc?.display_name, proc?.model_name, proc?.model, proc?.command]
        .filter(Boolean).join(" ").toLowerCase();
    return identity.includes("asr");
}

function serviceCategoryLabel(category) {
    return category === "asr" ? "ASR" : "标准 LLM";
}

let asrHistoryRecords = [];
let asrExpandedRecordId = "";
const asrHistoryTextCache = new Map();

function formatAsrDate(timestamp) {
    if (!timestamp) return "-";
    return new Date(Number(timestamp) * 1000).toLocaleString("zh-CN", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false,
    });
}

function asrStatusLabel(status) {
    return {
        queued: "排队中",
        transcribing: "转写中",
        completed: "已完成",
        error: "失败",
    }[status] || "已完成";
}

function asrStatusClass(status) {
    if (status === "completed") return "badge badge-running";
    if (status === "error") return "badge badge-danger";
    if (status === "transcribing") return "badge badge-warning";
    return "badge badge-stopped";
}

function renderAsrPage() {
    document.querySelector(".container").style.display = "none";
    document.title = "Qwen3 ASR 音频转写";
    document.body.insertAdjacentHTML("beforeend", `
        <main class="asr-page">
            <h1><img src="/icon.png" alt="LlamaManager" style="height:32px;vertical-align:middle;"> Qwen3 ASR 音频转写</h1>
            <div class="card">
                <h2 id="asr-service-name">正在连接服务...</h2>
                <input type="file" id="asr-audio-file" accept="audio/*,.m4a,.flac,.opus" multiple style="display:none;">
                <label for="asr-audio-file" id="asr-drop-zone" class="asr-drop-zone">
                    <strong>拖放一个或多个音频到这里，或点击选择文件</strong>
                    <div class="asr-hint">支持 MP3、M4A、WAV、FLAC、OGG、OPUS、AAC、WEBM 等常见格式</div>
                </label>
                <div id="asr-file-name" class="asr-file-name" style="margin-top:8px;">尚未选择音频文件</div>
                <div class="asr-hint">可一次上传多个文件。音频仅在本机临时处理，转写任务会依次执行，单片最长 10 分钟。</div>
                <div class="btn-group">
                    <button class="btn-success" id="asr-transcribe-btn" disabled>开始解析</button>
                    <button class="btn-secondary" onclick="window.close()">关闭页面</button>
                </div>
                <div id="asr-status" class="asr-hint"></div>
            </div>
            <div class="card">
                <h2>转写历史</h2>
                <div id="asr-history-list" class="asr-history-list"><div class="custom-service-empty">正在读取历史记录...</div></div>
                <div class="asr-hint">最新上传的记录置顶。仅保存文字与基础信息；原始音频和临时切片不会保留。</div>
            </div>
        </main>
    `);
}

function renderAsrHistory() {
    const wrap = document.getElementById("asr-history-list");
    if (!asrHistoryRecords.length) {
        wrap.innerHTML = '<div class="custom-service-empty">暂无转写历史</div>';
        return;
    }
    wrap.innerHTML = asrHistoryRecords.map(record => {
        const expanded = record.id === asrExpandedRecordId;
        const status = record.status || "completed";
        const durationText = record.duration === null || record.duration === undefined ? "时长待获取" : `${record.duration} 秒`;
        const meta = `${formatAsrDate(record.uploaded_at)} · ${record.original_filename || "未知文件"} · ${durationText}`;
        const cachedText = asrHistoryTextCache.get(record.id);
        const content = expanded && status === "completed" ? `
            <div class="asr-history-content">
                <div class="asr-history-edit">
                    <textarea id="asr-history-name-${record.id}" class="asr-history-name-input" rows="2" maxlength="160" aria-label="记录名称">${escapeHtml(record.name || "")}</textarea>
                    <div class="asr-history-edit-actions">
                        <button class="btn-secondary" onclick="saveAsrHistoryName('${record.id}')">保存名称</button>
                        <button class="btn-secondary" onclick="copyAsrHistoryText('${record.id}')">复制文字</button>
                    </div>
                </div>
                <textarea id="asr-history-text-${record.id}" class="log-area asr-history-text" readonly>${escapeHtml(cachedText || "正在读取转写文字...")}</textarea>
            </div>` : "";
        return `
            <div class="asr-history-item">
                <div class="asr-history-header">
                    <button class="asr-history-toggle" onclick="toggleAsrHistoryItem('${record.id}')" title="${escapeHtml(meta)}">
                        <span>${expanded ? "▾" : "▸"}</span>
                        <strong>${escapeHtml(record.name || "未命名转写")}</strong>
                        <span class="${asrStatusClass(status)}">${asrStatusLabel(status)}</span>
                        <span class="asr-history-meta">${escapeHtml(formatAsrDate(record.uploaded_at))}</span>
                    </button>
                    <button class="btn-danger asr-history-delete" onclick="deleteAsrHistory('${record.id}')" title="删除这条转写历史">删除</button>
                </div>
                ${content}
            </div>`;
    }).join("");
}

async function loadAsrHistory() {
    const data = await api("GET", "/api/asr/history");
    asrHistoryRecords = Array.isArray(data.records) ? data.records : [];
    if (!asrHistoryRecords.some(record => record.id === asrExpandedRecordId)) asrExpandedRecordId = "";
    renderAsrHistory();
}

async function toggleAsrHistoryItem(recordId) {
    const record = asrHistoryRecords.find(item => item.id === recordId);
    if (!record || (record.status || "completed") !== "completed") return;
    if (asrExpandedRecordId === recordId) {
        asrExpandedRecordId = "";
        renderAsrHistory();
        return;
    }
    asrExpandedRecordId = recordId;
    renderAsrHistory();
    const textArea = document.getElementById(`asr-history-text-${recordId}`);
    if (asrHistoryTextCache.has(recordId)) return;
    try {
        const data = await api("GET", `/api/asr/history/${encodeURIComponent(recordId)}/text`);
        asrHistoryTextCache.set(recordId, data.text || "");
        if (asrExpandedRecordId === recordId && textArea) textArea.value = data.text || "";
    } catch (e) {
        if (asrExpandedRecordId === recordId && textArea) textArea.value = `读取失败：${e.message}`;
    }
}

async function saveAsrHistoryName(recordId) {
    const input = document.getElementById(`asr-history-name-${recordId}`);
    const name = input ? input.value.trim() : "";
    if (!name) {
        showError("记录名称不能为空");
        return;
    }
    try {
        await api("PATCH", `/api/asr/history/${encodeURIComponent(recordId)}`, { name });
        const record = asrHistoryRecords.find(item => item.id === recordId);
        if (record) record.name = name;
        asrExpandedRecordId = "";
        await toggleAsrHistoryItem(recordId);
    } catch (e) {}
}

async function deleteAsrHistory(recordId) {
    const record = asrHistoryRecords.find(item => item.id === recordId);
    if (!record) return;
    const name = record.name || record.original_filename || "这条转写历史";
    if (!window.confirm(`确认删除“${name}”吗？此操作会同时删除已保存的转写文字。`)) return;
    try {
        await api("DELETE", `/api/asr/history/${encodeURIComponent(recordId)}`);
        asrHistoryTextCache.delete(recordId);
        if (asrExpandedRecordId === recordId) asrExpandedRecordId = "";
        await loadAsrHistory();
    } catch (e) {}
}

async function copyAsrHistoryText(recordId) {
    const text = asrHistoryTextCache.get(recordId);
    if (!text) return;
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const textArea = document.getElementById(`asr-history-text-${recordId}`);
        if (textArea) {
            textArea.select();
            document.execCommand("copy");
        }
    }
}

async function initAsrPage() {
    renderAsrPage();
    const fileInput = document.getElementById("asr-audio-file");
    const dropZone = document.getElementById("asr-drop-zone");
    const button = document.getElementById("asr-transcribe-btn");
    const fileName = document.getElementById("asr-file-name");
    const status = document.getElementById("asr-status");
    let selectedFiles = [];

    try {
        const service = await api("GET", "/api/asr");
        document.getElementById("asr-service-name").textContent = `${service.name} · PID ${service.pid}`;
        status.textContent = `服务已就绪，单片最长 ${Math.round((service.max_chunk_seconds || 600) / 60)} 分钟。`;
    } catch (e) {
        status.textContent = `无法连接 ASR 服务：${e.message}`;
        return;
    }

    try {
        await loadAsrHistory();
        setInterval(() => loadAsrHistory().catch(() => {}), 3000);
    } catch (e) {
        document.getElementById("asr-history-list").innerHTML = '<div class="custom-service-empty">历史记录读取失败</div>';
    }

    function selectAsrFiles(files) {
        selectedFiles = Array.from(files || []);
        button.disabled = selectedFiles.length === 0;
        if (!selectedFiles.length) {
            fileName.textContent = "尚未选择音频文件";
            return;
        }
        const names = selectedFiles.slice(0, 3).map(file => file.name).join("、");
        const suffix = selectedFiles.length > 3 ? ` 等 ${selectedFiles.length} 个文件` : "";
        fileName.textContent = `${names}${suffix} · 共 ${(selectedFiles.reduce((sum, file) => sum + file.size, 0) / 1024 / 1024).toFixed(1)} MB`;
        status.textContent = `已选择 ${selectedFiles.length} 个音频，点击“开始解析”即可加入转写队列。`;
    }

    fileInput.addEventListener("change", () => {
        selectAsrFiles(fileInput.files);
    });

    ["dragenter", "dragover"].forEach(eventName => {
        dropZone.addEventListener(eventName, event => {
            event.preventDefault();
            dropZone.classList.add("drag-over");
        });
    });
    ["dragleave", "drop"].forEach(eventName => {
        dropZone.addEventListener(eventName, event => {
            event.preventDefault();
            dropZone.classList.remove("drag-over");
        });
    });
    dropZone.addEventListener("drop", event => selectAsrFiles(event.dataTransfer.files));

    button.addEventListener("click", async () => {
        const files = [...selectedFiles];
        if (!files.length) return;
        button.disabled = true;
        fileInput.disabled = true;
        status.textContent = `正在上传 ${files.length} 个音频；上传完成后会在下方历史中显示转写状态。`;
        try {
            const outcomes = await Promise.allSettled(files.map(async file => {
                const response = await fetch("/api/asr/transcriptions", {
                    method: "POST",
                    headers: {
                        "Content-Type": file.type || "application/octet-stream",
                        "X-Audio-Filename": encodeURIComponent(file.name),
                    },
                    body: file,
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || data.error || `${file.name} 上传失败`);
                return data;
            }));
            const accepted = outcomes.filter(result => result.status === "fulfilled").length;
            await loadAsrHistory();
            status.textContent = `已接收 ${accepted}/${files.length} 个音频，转写状态会在下方历史列表自动更新。`;
            const failed = outcomes.find(result => result.status === "rejected");
            if (failed) showError(`部分音频上传失败：${failed.reason?.message || failed.reason}`);
            selectedFiles = [];
            fileInput.value = "";
            fileName.textContent = "尚未选择音频文件";
        } catch (e) {
            status.textContent = `上传失败：${e.message}`;
            showError(`音频上传失败：${e.message}`);
        } finally {
            button.disabled = selectedFiles.length === 0;
            fileInput.disabled = false;
        }
    });
}

// ── 设置 ──────────────────────────────────────────────

async function loadSettings() {
    currentSettings = await api("GET", "/api/settings");
    document.getElementById("set-model-dir").value = currentSettings.model_dir || "";
    document.getElementById("set-gpu-history-hours").value = currentSettings.gpu_history_hours || 2;
    document.getElementById("set-openai-api-base-url").value = currentSettings.openai_api_base_url || "";
    document.getElementById("set-openai-api-model").value = currentSettings.openai_api_model || "";
    document.getElementById("set-openai-api-key").value = "";
    document.getElementById("set-openai-api-key").placeholder = currentSettings.openai_api_key_configured
        ? "已保存，留空则不修改"
        : "留空则不使用密钥";
    document.getElementById("set-clear-openai-api-key").checked = false;
    document.getElementById("openai-api-status").textContent = currentSettings.openai_api_key_configured
        ? "密钥已保存（不会返回到浏览器）"
        : "尚未保存密钥";
    return currentSettings;
}

async function saveSettings() {
    const data = {
        model_dir: document.getElementById("set-model-dir").value,
        gpu_history_hours: parseFloat(document.getElementById("set-gpu-history-hours").value) || 2,
        openai_api_base_url: document.getElementById("set-openai-api-base-url").value.trim(),
        openai_api_model: document.getElementById("set-openai-api-model").value.trim(),
        openai_api_key: document.getElementById("set-openai-api-key").value,
        clear_openai_api_key: document.getElementById("set-clear-openai-api-key").checked,
    };
    const saved = await api("POST", "/api/settings", data);
    currentSettings = saved.data || currentSettings;
    document.getElementById("set-openai-api-key").value = "";
    document.getElementById("set-clear-openai-api-key").checked = false;
    document.getElementById("set-openai-api-key").placeholder = currentSettings.openai_api_key_configured
        ? "已保存，留空则不修改"
        : "留空则不使用密钥";
    document.getElementById("openai-api-status").textContent = currentSettings.openai_api_key_configured
        ? "密钥已保存（不会返回到浏览器）"
        : "尚未保存密钥";
    loadGpuStatus();
    alert("设置已保存");
}

async function testOpenAiApi() {
    const button = document.getElementById("openai-api-test-btn");
    const status = document.getElementById("openai-api-status");
    button.disabled = true;
    status.textContent = "正在测试连接...";
    try {
        const result = await api("POST", "/api/openai/test");
        const models = Array.isArray(result.models) ? result.models : [];
        const options = document.getElementById("openai-api-model-options");
        options.innerHTML = models.map(model => `<option value="${escapeHtml(model)}"></option>`).join("");
        const modelInput = document.getElementById("set-openai-api-model");
        if (!modelInput.value && models.length) modelInput.value = models[0];
        status.textContent = result.message || "连接成功";
    } catch (e) {
        status.textContent = `测试失败：${e.message}`;
    } finally {
        button.disabled = false;
    }
}

function resetServiceForm() {
    editingCustomServiceId = "";
    document.getElementById("custom-service-id").value = "";
    document.getElementById("custom-service-name").value = "";
    document.getElementById("custom-service-category").value = "llm";
    document.getElementById("custom-service-command").value = "";
    document.querySelectorAll(".start-gpu").forEach(input => { input.checked = false; });
    document.getElementById("custom-service-save-btn").textContent = "保存服务";
}

async function loadCustomServices() {
    const serviceData = await api("GET", "/api/custom-services");
    customServices = serviceData.services || [];
    renderRegisteredServices();
}

// 已注册服务列表（启动/停止/重启/打开 + 编辑/删除）
function renderRegisteredServices() {
    const wrap = document.getElementById("registered-service-list");
    if (!customServices.length) {
        wrap.className = "custom-service-empty";
        wrap.innerHTML = "暂无已注册服务";
        return;
    }
    // service_id -> 运行中的受管进程
    const runningMap = {};
    (managedProcessRecords || []).forEach(proc => {
        if (proc && proc.service_id && proc.running !== false) {
            runningMap[proc.service_id] = proc;
        }
    });
    wrap.className = "";
    wrap.innerHTML = customServices.map(service => {
        const run = runningMap[service.id];
        const detail = service.command || "";
        const categoryText = serviceCategoryLabel(service.service_category);
        const pidSuffix = run ? ` <span style="font-size:0.8em;color:#7d8ba3;">· PID ${escapeHtml(run.pid)}</span>` : "";
        const launchActions = run
            ? `<button class="btn-danger" onclick="stopManagedProcess(${Number(run.pid)})">停止</button>
               <button class="btn-warning" onclick="restartManagedProcess(${Number(run.pid)})">重启</button>
               ${(service.service_category === "asr" || run.port) ? `<button class="btn-primary" onclick="openManagedWebUI(${Number(run.pid)})">打开</button>` : ""}`
            : `<button class="btn-success" onclick="startRegisteredService('${escapeHtml(service.id)}')">启动</button>`;
        const gpuText = Array.isArray(service.gpu_indexes) && service.gpu_indexes.length
            ? `GPU ${service.gpu_indexes.join(",")}` : "使用全部 GPU";
        return `
        <div class="custom-service-row">
            <div class="custom-service-details">
                <strong class="custom-service-name" title="${escapeHtml(service.name || "")}">${escapeHtml(service.name || "Unknown")}${pidSuffix}</strong>
                <div class="custom-service-field">
                    <span class="custom-service-label">服务类型</span>
                    <span class="custom-service-value">${escapeHtml(categoryText)}</span>
                </div>
                <div class="custom-service-field">
                    <span class="custom-service-label">GPU</span>
                    <span class="custom-service-value">${escapeHtml(gpuText)}</span>
                </div>
                <div class="custom-service-field">
                    <span class="custom-service-label">启动命令</span>
                    <code class="custom-service-command" title="${escapeHtml(detail)}">${escapeHtml(detail)}</code>
                </div>
            </div>
            <div class="custom-service-actions">
                ${launchActions}
                <button class="btn-secondary" onclick="editService('${escapeHtml(service.id)}')">编辑</button>
                <button class="btn-danger" onclick="deleteService('${escapeHtml(service.id)}')">删除</button>
            </div>
        </div>`;
    }).join("");
}

function editService(serviceId) {
    const service = customServices.find(s => s.id === serviceId);
    if (!service) {
        showError("服务不存在");
        return;
    }
    editingCustomServiceId = service.id;
    document.getElementById("custom-service-id").value = service.id;
    document.getElementById("custom-service-name").value = service.name || "";
    document.getElementById("custom-service-category").value = service.service_category || "llm";
    document.getElementById("custom-service-command").value = service.command || "";
    const gpus = Array.isArray(service.gpu_indexes) ? service.gpu_indexes : [];
    document.querySelectorAll(".start-gpu").forEach(input => {
        input.checked = gpus.includes(parseInt(input.value));
    });
    document.getElementById("custom-service-save-btn").textContent = "更新服务";
}

async function saveService() {
    const id = document.getElementById("custom-service-id").value || editingCustomServiceId;
    const name = document.getElementById("custom-service-name").value.trim();
    const serviceCategory = document.getElementById("custom-service-category").value;
    const command = document.getElementById("custom-service-command").value.trim();
    if (!command) {
        showError("请输入启动命令");
        return;
    }
    const payload = { name, command, service_category: serviceCategory, gpu_indexes: selectedGpuIndexes() };
    if (id) payload.id = id;
    try {
        await api("POST", "/api/custom-services", payload);
        resetServiceForm();
        await loadCustomServices();
    } catch (e) {}
}

async function startRegisteredService(serviceId) {
    try {
        const result = await api("POST", "/api/start", { service_id: serviceId });
        const feedback = document.getElementById("start-feedback");
        feedback.style.display = "block";
        feedback.innerHTML = `<strong>已提交启动</strong> PID ${escapeHtml(result.pid)}。如服务仍在加载，请查看下方服务日志。`;
        await loadGpuStatus();
        await loadManagedProcesses();
        const logSelect = document.getElementById("log-process-select");
        if (result.pid) {
            logSelect.value = String(result.pid);
        }
        await loadLogs();
    } catch (e) {}
}

async function deleteService(serviceId) {
    const service = customServices.find(s => s.id === serviceId);
    const label = service ? service.name : serviceId;
    if (!confirm(`删除服务 ${label}？`)) {
        return;
    }
    try {
        await api("DELETE", `/api/custom-services/${encodeURIComponent(serviceId)}`);
        if (editingCustomServiceId === serviceId) {
            resetServiceForm();
        }
        await loadCustomServices();
    } catch (e) {}
}

// ── GPU 监控 ──────────────────────────────────────────

function initGpuCardsPerRow() {
    const saved = localStorage.getItem("gpu_cards_per_row") || "auto";
    const select = document.getElementById("gpu-cards-per-row");
    select.value = ["auto", "2", "3", "4"].includes(saved) ? saved : "auto";
    applyGpuGridColumns(select.value);
}

function setGpuCardsPerRow() {
    const value = document.getElementById("gpu-cards-per-row").value;
    localStorage.setItem("gpu_cards_per_row", value);
    applyGpuGridColumns(value);
}

function applyGpuGridColumns(value) {
    const grid = document.getElementById("gpu-grid");
    const waveGrid = document.getElementById("gpu-wave-grid");
    grid.className = "gpu-grid";
    waveGrid.className = "gpu-wave-grid";
    if (["2", "3", "4"].includes(value)) {
        grid.classList.add(`cols-${value}`);
        waveGrid.classList.add(`cols-${value}`);
    }
}

async function loadGpuStatus() {
    try {
        const data = await api("GET", "/api/gpus");
        updateGpuUI(data);
    } catch (e) {
        updateGpuUI({ ok: false, error: e.message, gpus: [] });
    }
}

function updateGpuUI(data) {
    const errorBox = document.getElementById("gpu-error");
    const waveGrid = document.getElementById("gpu-wave-grid");
    const grid = document.getElementById("gpu-grid");
    const tbody = document.getElementById("gpu-process-body");
    const gpus = Array.isArray(data.gpus) ? data.gpus : [];
    const managedProcesses = Array.isArray(data.managed_processes) ? data.managed_processes : [];
    const historyHours = Number(data.history_hours || currentSettings.gpu_history_hours || 2);

    currentGpuIndexes = gpus.map(gpu => Number(gpu.index));
    managedProcessRecords = managedProcesses;
    updateLogProcessSelect();
    updateStartGpuList(gpus);

    if (data.error) {
        errorBox.textContent = data.stale ? `当前 GPU 状态不可用，正在显示本地历史波形: ${data.error}` : data.error;
        errorBox.style.display = "block";
    } else {
        errorBox.textContent = "";
        errorBox.style.display = "none";
    }

    if (gpus.length === 0) {
        waveGrid.innerHTML = `<div class="gpu-empty">${data.ok === false ? "暂无可用 GPU 波形数据" : "未检测到 GPU"}</div>`;
        grid.innerHTML = `<div class="gpu-empty">${data.ok === false ? "暂无可用 GPU 数据" : "未检测到 GPU"}</div>`;
    } else {
        waveGrid.innerHTML = gpus.map(gpu => `
            <div class="gpu-wave-card">
                <div class="gpu-wave-title">
                    <strong>GPU ${escapeHtml(gpu.index)}</strong>
                    <span title="${escapeHtml(gpu.name)}">${escapeHtml(gpu.name || "Unknown")}</span>
                </div>
                <canvas class="gpu-wave-canvas" data-gpu-index="${escapeHtml(gpu.index)}"></canvas>
            </div>
        `).join("");
        drawGpuWaveforms(gpus, historyHours);

        grid.innerHTML = gpus.map(gpu => {
            const util = clampPercent(gpu.gpu_util);
            const hasMem = gpu.used_mem !== null && gpu.used_mem !== undefined && gpu.total_mem !== null && gpu.total_mem !== undefined;
            const memText = hasMem ? `${formatMem(gpu.used_mem)} / ${formatMem(gpu.total_mem)}` : "-";
            const users = Array.isArray(gpu.users) && gpu.users.length > 0 ? gpu.users.join(", ") : "None";
            return `
                <div class="gpu-card">
                    <div class="gpu-card-title">
                        <strong>GPU ${escapeHtml(gpu.index)}${gpu.stale ? " · History" : ""}</strong>
                        <span title="${escapeHtml(gpu.name)}">${escapeHtml(gpu.name || "Unknown")}</span>
                    </div>
                    <div class="gpu-metrics">
                        <div class="gpu-metric"><label>Util</label><span>${util}%</span></div>
                        <div class="gpu-metric"><label>Memory</label><span title="${escapeHtml(memText)}">${escapeHtml(memText)}</span></div>
                        <div class="gpu-metric"><label>Temp</label><span>${gpu.temperature === null || gpu.temperature === undefined ? "-" : escapeHtml(gpu.temperature) + " °C"}</span></div>
                        <div class="gpu-metric"><label>Processes</label><span>${escapeHtml(gpu.process_count ?? 0)}</span></div>
                        <div class="gpu-metric"><label>Users</label><span title="${escapeHtml(users)}">${escapeHtml(users)}</span></div>
                        <div class="gpu-metric"><label>Driver</label><span title="${escapeHtml(gpu.driver_version)}">${escapeHtml(gpu.driver_version || "-")}</span></div>
                    </div>
                    <div class="gpu-util-bar" title="GPU Util ${util}%">
                        <div class="gpu-util-fill" style="width:${util}%"></div>
                    </div>
                </div>
            `;
        }).join("");
    }

    if (managedProcesses.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="gpu-empty">暂无受管进程</td></tr>`;
        return;
    }

    tbody.innerHTML = managedProcesses.map(proc => {
        const openAction = (isAsrProcess(proc) || proc.port) ? `<button class="btn-primary" onclick="openManagedWebUI(${Number(proc.pid)})">Open</button>` : "";
        return `
        <tr>
            <td>${escapeHtml(proc.gpu ?? "-")}</td>
            <td title="${escapeHtml(proc.gpu_name || "")}">${escapeHtml(proc.gpu_name || "-")}</td>
            <td>${proc.gpu_util === null || proc.gpu_util === undefined ? "-" : clampPercent(proc.gpu_util) + "%"}</td>
            <td>${escapeHtml(proc.pid ?? "-")}</td>
            <td>${escapeHtml(formatMem(proc.used_mem))}</td>
            <td>${escapeHtml(formatMem(proc.total_mem))}</td>
            <td>${proc.temperature === null || proc.temperature === undefined ? "-" : escapeHtml(proc.temperature) + " °C"}</td>
            <td title="${escapeHtml(proc.command || "")}">${escapeHtml(proc.display_name || proc.model_name || "Unknown")}</td>
            <td>
                ${openAction}
                <button class="btn-danger" onclick="stopManagedProcess(${Number(proc.pid)})">Stop</button>
                <button class="btn-warning" onclick="restartManagedProcess(${Number(proc.pid)})">Restart</button>
            </td>
        </tr>
    `;
    }).join("");
}

function updateStartGpuList(gpus) {
    const wrap = document.getElementById("start-gpu-list");
    const checked = new Set(
        Array.from(wrap.querySelectorAll("input[type='checkbox']:checked")).map(input => input.value)
    );
    if (!gpus.length) {
        wrap.innerHTML = `<span style="color:#888;">未检测到 GPU，默认使用全部 GPU</span>`;
        return;
    }
    wrap.innerHTML = gpus.map(gpu => {
        const value = String(gpu.index);
        const isChecked = checked.has(value) ? "checked" : "";
        return `
            <label class="checkbox-row" style="margin-top:0;">
                <input type="checkbox" class="start-gpu" value="${escapeHtml(value)}" ${isChecked}>
                <span>GPU ${escapeHtml(gpu.index)}</span>
            </label>
        `;
    }).join("");
}

function selectedGpuIndexes() {
    return Array.from(document.querySelectorAll(".start-gpu:checked"))
        .map(input => parseInt(input.value))
        .filter(n => Number.isInteger(n) && n >= 0);
}

function drawGpuWaveforms(gpus, historyHours) {
    const now = Date.now() / 1000;
    const startTs = now - historyHours * 3600;
    gpus.forEach(gpu => {
        const canvas = document.querySelector(`canvas[data-gpu-index="${gpu.index}"]`);
        if (!canvas) return;
        drawGpuWaveform(canvas, gpu, startTs, now);
    });
}

function drawGpuWaveform(canvas, gpu, startTs, endTs) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(rect.width * dpr));
    const height = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
    }

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#10161d";
    ctx.fillRect(0, 0, width, height);

    const left = 44 * dpr;
    const right = 10 * dpr;
    const top = 10 * dpr;
    const bottom = 26 * dpr;
    const plotW = width - left - right;
    const plotH = height - top - bottom;

    ctx.font = `${11 * dpr}px SF Mono, Consolas, monospace`;
    ctx.textBaseline = "middle";
    ctx.strokeStyle = "#263247";
    ctx.fillStyle = "#8fa1bd";
    ctx.lineWidth = 1 * dpr;

    [0, 50, 100].forEach(value => {
        const y = top + plotH - (value / 100) * plotH;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(width - right, y);
        ctx.stroke();
        ctx.fillText(String(value), 8 * dpr, y);
    });

    ctx.textBaseline = "top";
    ctx.fillText(formatClock(startTs), left, height - bottom + 7 * dpr);
    const endText = formatClock(endTs);
    const endWidth = ctx.measureText(endText).width;
    ctx.fillText(endText, width - right - endWidth, height - bottom + 7 * dpr);

    const history = Array.isArray(gpu.history) ? gpu.history : [];
    const points = history
        .filter(p => p.timestamp >= startTs && p.timestamp <= endTs)
        .map(p => ({
            x: left + ((p.timestamp - startTs) / (endTs - startTs)) * plotW,
            y: top + plotH - (clampPercent(p.gpu_util) / 100) * plotH,
        }));

    if (points.length === 0) {
        ctx.fillStyle = "#6f7d92";
        ctx.textAlign = "center";
        ctx.fillText("等待采样", left + plotW / 2, top + plotH / 2);
        ctx.textAlign = "left";
        return;
    }

    ctx.strokeStyle = "#52d273";
    ctx.lineWidth = 2 * dpr;
    ctx.beginPath();
    points.forEach((point, i) => {
        if (i === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
    });
    ctx.stroke();

    const last = points[points.length - 1];
    ctx.fillStyle = "#6be675";
    ctx.beginPath();
    ctx.arc(last.x, last.y, 3 * dpr, 0, Math.PI * 2);
    ctx.fill();
}

// ── 启动 / 停止 / 重启 ───────────────────────────────

// 一次性 llama 启动已废弃：所有启动都走 startRegisteredService（基于已注册服务）

// 基于「当前实例」的一次性 stop/restart/openWebUI 已随启动改造废弃，统一用受管进程的 stop/restart/open

function openManagedWebUI(pid) {
    const proc = (managedProcessRecords || []).find(item => Number(item.pid) === Number(pid));
    if (isAsrProcess(proc)) {
        window.open("/asr", "_blank");
        return;
    }
    window.open(`/llama-process/${pid}/`, "_blank");
}

async function stopManagedProcess(pid) {
    try {
        await api("POST", "/api/stop", { pid });
        loadGpuStatus();
        loadManagedProcesses();
        loadLogs();
    } catch (e) {}
}

async function restartManagedProcess(pid) {
    try {
        await api("POST", "/api/restart", { pid });
        loadGpuStatus();
        loadManagedProcesses();
        loadLogs();
    } catch (e) {}
}

// ── 日志 ──────────────────────────────────────────────

async function loadManagedProcesses() {
    try {
        const data = await api("GET", "/api/managed-processes");
        managedProcessRecords = data.processes || [];
        updateLogProcessSelect();
        renderRegisteredServices();
    } catch (e) {}
}

function updateLogProcessSelect() {
    const select = document.getElementById("log-process-select");
    const current = select.value;
    select.innerHTML = "";
    const defaultOpt = document.createElement("option");
    defaultOpt.value = "";
    defaultOpt.textContent = "当前运行任务";
    select.appendChild(defaultOpt);
    managedProcessRecords.filter(proc => proc.running !== false).forEach(proc => {
        const opt = document.createElement("option");
        opt.value = String(proc.pid);
        const gpuText = Array.isArray(proc.gpu_indexes) && proc.gpu_indexes.length
            ? `GPU ${proc.gpu_indexes.join(",")}` : "全部 GPU";
        opt.textContent = `PID ${proc.pid} · ${proc.display_name || proc.model_name || "Unknown"} · ${gpuText}`;
        select.appendChild(opt);
    });
    if (Array.from(select.options).some(opt => opt.value === current)) {
        select.value = current;
    }
}

async function loadLogs() {
    try {
        await loadManagedProcesses();
        const pid = document.getElementById("log-process-select").value;
        const path = pid ? `/api/logs?pid=${encodeURIComponent(pid)}` : "/api/logs";
        const data = await api("GET", path);
        document.getElementById("log-area").value = data.logs || "";
    } catch (e) {}
}

// ── 下载 ──────────────────────────────────────────────

async function startDownload() {
    const repo = document.getElementById("dl-repo").value.trim();
    const filename = document.getElementById("dl-filename").value.trim();
    const force_download = document.getElementById("dl-force").checked;
    const btn = document.getElementById("btn-download");
    const statusText = document.getElementById("dl-status-text");
    if (!repo) {
        showError("请输入仓库名");
        return;
    }
    btn.disabled = true;
    statusText.textContent = "正在创建下载任务...";
    try {
        const result = await api("POST", "/api/download", { repo, filename, force_download });
        statusText.textContent = `已新增下载任务：${downloadLabel(result.task || { repo, filename })}`;
        await loadDownloadStatus();
        const logSelect = document.getElementById("download-log-select");
        if (result.id) {
            logSelect.value = result.id;
        }
        await loadDownloadLogs();
    } catch (e) {
        statusText.textContent = "";
    } finally {
        btn.disabled = false;
    }
}

async function cancelDownload(taskId) {
    try {
        await api("POST", "/api/download/cancel", { task_id: taskId });
        await loadDownloadStatus();
        await loadDownloadLogs();
    } catch (e) {}
}

async function loadDownloadStatus() {
    try {
        const data = await api("GET", "/api/download/status");
        const previousDone = new Set(completedDownloadTaskIds);
        updateDownloadUI(data);
        const hasNewCompleted = downloadTasks.some(task =>
            task.done && !task.running && !task.error && !previousDone.has(task.id)
        );
        if (hasNewCompleted) await loadCustomServices();
    } catch (e) {}
}

function downloadLabel(data) {
    const lbl = data.filename ? `${data.repo || ""} / ${data.filename}` : `${data.repo || ""} 全量`;
    return data.target_dir ? `${lbl} → ${data.target_dir}` : lbl;
}

function downloadState(task) {
    if (task.running && task.cancel_requested) return { text: "Cancelling", className: "badge badge-warning" };
    if (task.running) return { text: "Downloading", className: "badge badge-running" };
    if (task.done && task.error) return { text: "Error", className: "badge badge-danger" };
    if (task.done) return { text: "Done", className: "badge badge-running" };
    return { text: "Idle", className: "badge badge-stopped" };
}

function progressMeta(task) {
    if (task.progress && task.progress.total > 0) {
        return {
            pct: task.done && !task.error ? 100 : task.progress.percentage,
            text: `${task.progress.percentage}%`,
            size: `${task.progress.downloaded_mb} MB / ${task.progress.total_mb} MB`,
        };
    }
    if (task.running) {
        return { pct: 0, text: "准备中...", size: "" };
    }
    return { pct: 0, text: "-", size: "" };
}

function updateDownloadUI(data) {
    downloadTasks = Array.isArray(data.downloads) ? data.downloads : [];
    downloadTasks.forEach(task => {
        if (task.done && !task.running) {
            completedDownloadTaskIds.add(task.id);
        }
    });
    updateDownloadTaskList();
    updateDownloadLogSelect();
}

function updateDownloadTaskList() {
    const wrap = document.getElementById("download-task-list");
    if (!downloadTasks.length) {
        wrap.innerHTML = `<div class="custom-service-empty">暂无下载任务</div>`;
        return;
    }
    wrap.innerHTML = downloadTasks.map(task => {
        const state = downloadState(task);
        const progress = progressMeta(task);
        const errorText = task.error ? ` · ${task.error}` : "";
        return `
            <div class="download-task-row">
                <div class="download-task-title">
                    <strong title="${escapeHtml(downloadLabel(task))}">${escapeHtml(task.label || downloadLabel(task))}</strong>
                    <span title="${escapeHtml(task.target_dir || "")}">${escapeHtml(task.target_dir || "-")}${escapeHtml(errorText)}</span>
                </div>
                <div class="download-progress">
                    <div class="download-progress-track">
                        <div class="download-progress-fill" style="width:${progress.pct}%"></div>
                    </div>
                    <div class="download-progress-meta">
                        <span>${escapeHtml(progress.text)}</span>
                        <span>${escapeHtml(progress.size)}</span>
                    </div>
                </div>
                <span class="${state.className}">${state.text}</span>
                <div class="download-task-actions">
                    <button class="btn-secondary" onclick="selectDownloadLog('${escapeHtml(task.id)}')">Logs</button>
                    <button class="btn-danger" onclick="cancelDownload('${escapeHtml(task.id)}')" ${task.running && !task.cancel_requested ? "" : "disabled"}>Cancel</button>
                </div>
            </div>
        `;
    }).join("");
}

function updateDownloadLogSelect() {
    const select = document.getElementById("download-log-select");
    const current = select.value;
    select.innerHTML = `<option value="">最新下载任务</option>`;
    downloadTasks.forEach(task => {
        const opt = document.createElement("option");
        opt.value = task.id;
        const state = downloadState(task).text;
        opt.textContent = `${state} · ${task.label || downloadLabel(task)}`;
        select.appendChild(opt);
    });
    if (Array.from(select.options).some(opt => opt.value === current)) {
        select.value = current;
    }
}

async function selectDownloadLog(taskId) {
    document.getElementById("download-log-select").value = taskId;
    await loadDownloadLogs();
}

// ── 下载日志 ──────────────────────────────────────────

async function loadDownloadLogs() {
    try {
        const taskId = document.getElementById("download-log-select").value;
        const path = taskId ? `/api/download/logs?task_id=${encodeURIComponent(taskId)}` : "/api/download/logs";
        const data = await api("GET", path);
        if (Array.isArray(data.downloads)) {
            downloadTasks = data.downloads;
            updateDownloadTaskList();
            updateDownloadLogSelect();
            if (taskId) {
                document.getElementById("download-log-select").value = taskId;
            }
        }
        document.getElementById("dl-log-area").value = data.logs || "";
    } catch (e) {}
}

// ── 初始化 ────────────────────────────────────────────

document.addEventListener("DOMContentLoaded", () => {
    if (window.location.pathname === "/asr" || window.location.pathname === "/asr/") {
        initAsrPage();
        return;
    }
    initGpuCardsPerRow();
    loadSettings().then(loadCustomServices);
    loadGpuStatus();
    loadManagedProcesses();
    loadLogs();
    loadDownloadLogs();

    // 自动刷新
    setInterval(loadGpuStatus, 5000);
    setInterval(loadLogs, 5000);
    setInterval(loadDownloadStatus, 3000);
    setInterval(loadDownloadLogs, 5000);
    loadDownloadStatus();
});
</script>
